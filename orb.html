<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #08000f; overflow: hidden; }
    canvas { display: block; }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function() {
    // ── Scene setup ──
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x08000f);

    const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 10);
    camera.position.z = 2.5;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // ── Point cloud orb ──
    const ORB_RADIUS = 1.0;
    const POINT_COUNT = 400;
    const POINT_DEVIATION = 0.15;
    const CONNECTION_RADIUS = 0.35;

    // Base positions on unit sphere
    const basePositions = new Float32Array(POINT_COUNT * 3);
    const driftOffsets = new Float32Array(POINT_COUNT * 3);
    const driftDirections = new Float32Array(POINT_COUNT * 3);

    for (let i = 0; i < POINT_COUNT; i++) {
        // Random point on sphere
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const r = ORB_RADIUS + (Math.random() - 0.5) * POINT_DEVIATION * 2;

        basePositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
        basePositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
        basePositions[i * 3 + 2] = r * Math.cos(phi);

        // Random drift direction
        driftDirections[i * 3] = (Math.random() - 0.5) * 0.003;
        driftDirections[i * 3 + 1] = (Math.random() - 0.5) * 0.003;
        driftDirections[i * 3 + 2] = (Math.random() - 0.5) * 0.003;
    }

    const pointPositions = new Float32Array(POINT_COUNT * 3);
    pointPositions.set(basePositions);

    const pointGeo = new THREE.BufferGeometry();
    pointGeo.setAttribute('position', new THREE.BufferAttribute(pointPositions, 3));

    const pointMat = new THREE.PointsMaterial({
        color: 0xff2d9b,
        size: 0.025,
        sizeAttenuation: true,
        transparent: true,
        opacity: 0.9,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
    });

    const points = new THREE.Points(pointGeo, pointMat);
    scene.add(points);

    // ── Connection lines ──
    const lineGeo = new THREE.BufferGeometry();
    const linePositions = new Float32Array(POINT_COUNT * POINT_COUNT * 6); // pre-allocate
    lineGeo.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));

    const lineMat = new THREE.LineBasicMaterial({
        color: 0x9d00ff,
        transparent: true,
        opacity: 0.4,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
    });

    const lines = new THREE.LineSegments(lineGeo, lineMat);
    scene.add(lines);

    // ── State machine ──
    let currentState = "idle";
    let targetScale = 1.0;
    let currentScale = 1.0;
    let targetPointOpacity = 0.9;
    let currentPointOpacity = 0.9;
    let targetLineOpacity = 0.4;
    let currentLineOpacity = 0.4;
    let micLevel = 0.0;
    let targetMicLevel = 0.0;

    window.setState = function(state) {
        const valid = ["idle", "listening", "thinking", "speaking"];
        if (!valid.includes(state)) return;
        currentState = state;
        switch (state) {
            case "idle":
                targetScale = 1.0;
                targetPointOpacity = 0.65;
                targetLineOpacity = 0.3;
                break;
            case "listening":
                targetScale = 0.85;
                targetPointOpacity = 0.55;
                targetLineOpacity = 0.25;
                break;
            case "thinking":
                targetScale = 1.0;
                targetPointOpacity = 0.8;
                targetLineOpacity = 0.45;
                break;
            case "speaking":
                targetScale = 1.2;
                targetPointOpacity = 1.0;
                targetLineOpacity = 0.8;
                break;
        }
    };

    window.setMicLevel = function(level) {
        targetMicLevel = Math.max(0.0, Math.min(1.0, level));
    };

    // ── Rebuild connections each frame ──
    function rebuildConnections() {
        let pairCount = 0;
        for (let i = 0; i < POINT_COUNT; i++) {
            for (let j = i + 1; j < POINT_COUNT; j++) {
                const dx = pointPositions[i * 3] - pointPositions[j * 3];
                const dy = pointPositions[i * 3 + 1] - pointPositions[j * 3 + 1];
                const dz = pointPositions[i * 3 + 2] - pointPositions[j * 3 + 2];
                const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
                if (dist < CONNECTION_RADIUS * currentScale && pairCount < (POINT_COUNT * 20)) {
                    const idx = pairCount * 6;
                    linePositions[idx] = pointPositions[i * 3];
                    linePositions[idx + 1] = pointPositions[i * 3 + 1];
                    linePositions[idx + 2] = pointPositions[i * 3 + 2];
                    linePositions[idx + 3] = pointPositions[j * 3];
                    linePositions[idx + 4] = pointPositions[j * 3 + 1];
                    linePositions[idx + 5] = pointPositions[j * 3 + 2];
                    pairCount++;
                }
            }
        }
        // Pad remaining
        for (let k = pairCount * 6; k < POINT_COUNT * 20 * 6; k++) {
            linePositions[k] = 0;
        }
        lineGeo.setDrawRange(0, pairCount * 2);
        lineGeo.attributes.position.needsUpdate = true;
    }

    // ── Animation ──
    function animate() {
        requestAnimationFrame(animate);

        // Lerp mic level
        micLevel += (targetMicLevel - micLevel) * 0.1;
        const boostedLevel = Math.pow(micLevel, 2.5);

        // Lerp state values
        currentScale += (targetScale - currentScale) * 0.05;
        currentPointOpacity += (targetPointOpacity - currentPointOpacity) * 0.05;
        currentLineOpacity += (targetLineOpacity - currentLineOpacity) * 0.05;

        // Update point positions with drift
        for (let i = 0; i < POINT_COUNT; i++) {
            const driftSpeed = 0.0005 + boostedLevel * 0.02;
            driftOffsets[i * 3] += driftDirections[i * 3] * driftSpeed;
            driftOffsets[i * 3 + 1] += driftDirections[i * 3 + 1] * driftSpeed;
            driftOffsets[i * 3 + 2] += driftDirections[i * 3 + 2] * driftSpeed;

            // Wrap offsets
            if (Math.abs(driftOffsets[i * 3]) > 0.3) driftDirections[i * 3] *= -1;
            if (Math.abs(driftOffsets[i * 3 + 1]) > 0.3) driftDirections[i * 3 + 1] *= -1;
            if (Math.abs(driftOffsets[i * 3 + 2]) > 0.3) driftDirections[i * 3 + 2] *= -1;

            pointPositions[i * 3] = basePositions[i * 3] * currentScale + driftOffsets[i * 3];
            pointPositions[i * 3 + 1] = basePositions[i * 3 + 1] * currentScale + driftOffsets[i * 3 + 1];
            pointPositions[i * 3 + 2] = basePositions[i * 3 + 2] * currentScale + driftOffsets[i * 3 + 2];
        }

        // Thinking: flicker 15% of points
        if (currentState === "thinking") {
            pointMat.opacity = 0.5 + Math.random() * 0.5;
        } else {
            pointMat.opacity = currentPointOpacity;
        }
        lineMat.opacity = currentLineOpacity + boostedLevel * 0.5;

        pointGeo.attributes.position.needsUpdate = true;
        rebuildConnections();

        // Rotate
        points.rotation.y += 0.003;
        lines.rotation.y = points.rotation.y;

        renderer.render(scene, camera);
    }

    // ── Resize ──
    function resize() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        renderer.setSize(w, h);
        camera.aspect = w / (h || 1);
        camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();

    // Go!
    animate();
    console.log('[orb.html] Three.js scene ready.');
})();
</script>
</body>
</html>
